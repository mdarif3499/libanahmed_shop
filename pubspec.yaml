name: ahmed_shop
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^5.0.0-release-candidate-9.3.2
  # time zone related
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0
  intl: ^0.20.2
  # ui related
  skeletonizer: ^1.4.3
  flutter_rating_bar: ^4.0.1
  flutter_xlider: ^3.5.0
  connectivity_plus: ^6.1.3
  readmore: ^3.0.0
  # image related
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_image_compress: ^2.4.0
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  # storage
  get_storage: ^2.1.1
  # api services
  dio: ^5.8.0+1
  mime: ^2.0.0
  http_parser: ^4.1.2
  pretty_dio_logger: ^1.4.0
  http: ^1.3.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  pinput: ^5.0.1
  file_picker: ^9.2.1
  easy_stepper: ^0.8.5+1
  fl_chart: ^0.70.2

  shared_preferences: ^2.5.3
  device_info_plus: ^11.5.0
  country_picker: ^2.0.27
  intl_phone_field: ^3.2.0
  flutter_widget_from_html: ^0.16.0
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/user/
    - assets/icons/owner/
    - assets/images/owner/
    - assets/images/user/
